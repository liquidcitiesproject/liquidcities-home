<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Liquid Cities Project</title>
<link rel="stylesheet" href="style.css?v=20260728f">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<header id="site-header"></header>
<div id="filter-bar"></div>

<main class="wrap narrow article" id="contactMain"></main>

<div class="footer">Liquid Cities Project</div>

<script src="app.js?v=20260728f"></script>
<script>
renderHeader('contact');
applyI18n();

// Contact 하위 필터: 이메일 / 인스타그램 (실제 주소는 추후 채움)
const FILTERS = [
  { key: 'email',     i18n: 'cfEmail' },
  { key: 'instagram', i18n: 'cfInstagram' },
];
let currentFilter = new URLSearchParams(location.search).get('filter') || 'email';
if (!FILTERS.some(f => f.key === currentFilter)) currentFilter = 'email';

function draw(filter) {
  currentFilter = filter;
  const main = document.getElementById('contactMain');
  if (filter === 'instagram') {
    main.innerHTML =
      '<p><a href="https://www.instagram.com/liquidcities.project/" target="_blank" rel="noopener" ' +
      'style="text-decoration:underline; text-underline-offset:3px">@liquidcities.project</a></p>';
  } else {
    main.innerHTML =
      '<p><a href="mailto:liquidcities.project@gmail.com" ' +
      'style="text-decoration:underline; text-underline-offset:3px">liquidcities.project@gmail.com</a></p>';
  }
}

function onSelect(key) {
  history.replaceState(null, '', 'contact?filter=' + key);
  renderFilterBar('filter-bar', FILTERS, key, onSelect);
  draw(key);
}

renderFilterBar('filter-bar', FILTERS, currentFilter, onSelect);
draw(currentFilter);

window._lcRerender = () => {
  renderFilterBar('filter-bar', FILTERS, currentFilter, onSelect);
  draw(currentFilter);
};
</script>
</body>
</html>
