<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects — Liquid Cities Project</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<header id="site-header"></header>

<main id="projects-content" class="wrap narrow"></main>

<div class="footer">Liquid Cities Project</div>

<script src="app.js"></script>
<script>
renderHeader('projects');
applyI18n();

// Projects — 하위 필터 없이 감정 좌표 맵(앱)을 바로 임베드.
function draw() {
  const main = document.getElementById('projects-content');
  main.innerHTML = '';
  const old = document.getElementById('projMapFrame');
  if (old) old.remove();
  document.body.classList.remove('proj-map');
  // 필터 바가 없으므로 iframe top 계산용 --filterH는 0
  document.documentElement.style.setProperty('--filterH', '0px');

  if (FEATURED_BOARD_UID) {
    document.body.classList.add('proj-map'); // 푸터 숨김(전체화면 iframe)
    const iframe = document.createElement('iframe');
    iframe.id = 'projMapFrame';
    iframe.className = 'map-frame-inline';
    iframe.src = APP_BASE + '?board=' + encodeURIComponent(FEATURED_BOARD_UID);
    iframe.setAttribute('title', 'Liquid Cities shared board');
    iframe.setAttribute('loading', 'lazy');
    document.body.appendChild(iframe);
  } else {
    main.innerHTML =
      '<p class="sub">' + t('mapNotConn') + '</p>' +
      '<p>' + t('mapHint') + '</p>' +
      '<div class="row" style="margin-top:24px"><a class="btn" href="' + APP_BASE +
      '" target="_blank" rel="noopener">' + t('openApp') + '</a></div>';
  }
}

draw();
window._lcRerender = draw; // 언어 전환 시 다시 그림
</script>
</body>
</html>
