<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects — Liquid Cities Project</title>
<link rel="stylesheet" href="style.css?v=20260726k">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<header id="site-header"></header>
<div id="filter-bar"></div>

<main id="projects-content" class="wrap narrow"></main>

<div class="footer" id="projFooter">Liquid Cities Project</div>

<script src="app.js?v=20260726k"></script>
<script>
renderHeader('projects');
applyI18n();

// Projects 하위 필터: Emotional map / 전시(Exhibitions)
const FILTERS = [
  { key: 'emotional-map', i18n: 'pfEmotionalMap' },
  { key: 'exhibitions',   i18n: 'pfExhibitions' },
];
let currentFilter = new URLSearchParams(location.search).get('filter') || 'emotional-map';
if (!FILTERS.some(f => f.key === currentFilter)) currentFilter = 'emotional-map';

function draw(filter) {
  currentFilter = filter;
  const main = document.getElementById('projects-content');
  const old = document.getElementById('projMapFrame');
  if (old) old.remove();
  document.body.classList.remove('proj-map');
  main.innerHTML = '';

  if (filter === 'emotional-map') {
    if (FEATURED_BOARD_UID) {
      document.body.classList.add('proj-map'); // 푸터 숨김(전체화면 iframe)
      const iframe = document.createElement('iframe');
      iframe.id = 'projMapFrame';
      iframe.className = 'map-frame-inline';
      iframe.src = APP_BASE + '?board=' + encodeURIComponent(FEATURED_BOARD_UID);
      iframe.setAttribute('title', 'Liquid Cities shared board');
      iframe.setAttribute('loading', 'lazy');
      document.body.appendChild(iframe);
    } else {
      main.innerHTML =
        '<p class="sub">' + t('mapNotConn') + '</p>' +
        '<p>' + t('mapHint') + '</p>' +
        '<div class="row" style="margin-top:24px"><a class="btn" href="' + APP_BASE +
        '" target="_blank" rel="noopener">' + t('openApp') + '</a></div>';
    }
  } else {
    // 전시(Exhibitions) — 콘텐츠는 추후
    main.innerHTML = '<p class="sub">' + t('projComingSoon') + '</p>';
  }
}

function onSelect(key) {
  history.replaceState(null, '', 'projects?filter=' + key);
  renderFilterBar('filter-bar', FILTERS, key, onSelect);
  draw(key);
}

renderFilterBar('filter-bar', FILTERS, currentFilter, onSelect);
draw(currentFilter);

window._lcRerender = () => {
  renderFilterBar('filter-bar', FILTERS, currentFilter, onSelect);
  draw(currentFilter);
};
</script>
</body>
</html>
