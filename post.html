<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Cities Project</title>
<link rel="stylesheet" href="style.css?v=20260727u">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<header id="site-header"></header>

<main class="wrap article" id="article">
  <div class="status" id="status" data-i18n="loading">Loading…</div>
</main>

<div class="footer">Liquid Cities Project</div>

<script src="app.js?v=20260727u"></script>
<script>
(async () => {
  const id = new URLSearchParams(location.search).get('id');
  const article = document.getElementById('article');
  const post = id ? await loadPost(id) : null;
  if (!post) { renderHeader(''); applyI18n(); document.getElementById('status').textContent = t('postNotFound'); return; }
  renderHeader('making-spaces');
  applyI18n();
  function draw() {
    document.title = pickLangTitle(post) + ' — Liquid Cities Project';
    article.innerHTML =
      '<h1>' + escapeHtml(pickLangTitle(post)) + '</h1>' +
      '<span class="post-date">' + fmtDate(post.created_at) + '</span>' +
      (post.cover ? '<img src="' + escapeHtml(post.cover) + '" style="max-width:100%; display:block; margin:0 0 24px">' : '') +
      '<div class="article-body">' + renderMarkdown(pickLangBody(post)) + '</div>' +
      '<p style="margin-top:40px"><a href="making-spaces?filter=' + (post.kind === 'essay' ? 'essay' : 'blog') +
        '" style="text-decoration:underline; text-underline-offset:3px">' + t('back') + '</a></p>';
  }
  draw();
  window._lcRerender = draw;
})();
</script>
</body>
</html>
