<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fieldwork — Liquid Cities Project</title>
<link rel="stylesheet" href="style.css?v=20260727a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<header id="site-header"></header>

<main id="fieldworkMain">
  <div id="fieldList"></div>
</main>

<div class="footer">Liquid Cities Project</div>

<script src="app.js?v=20260727a"></script>
<script>
renderHeader('fieldwork');
applyI18n();

// 필드워크 도시 목록 — 가로 선으로 구분된 행. 도시가 늘면 여기에 추가.
// 내용은 posts(kind='fieldwork', 제목=영문 도시명)로 관리 — 행을 누르면 펼쳐진다.
const CITIES = [
  { key: 'seoul',     en: 'Seoul',     ko: '서울' },
  { key: 'london',    en: 'London',    ko: '런던' },
  { key: 'singapore', en: 'Singapore', ko: '싱가포르' },
  { key: 'shanghai',  en: 'Shanghai',  ko: '상하이' },
];
// 마지막 행 — 궁금증을 유발하는 문구
const TEASER = {
  en: 'And the next city… might be the one you\'re standing in.',
  ko: '그리고 다음 도시는… 지금 당신이 서 있는 그곳일지도 모릅니다.',
};

let cityPosts = [];
// ?city=seoul 이면 목록 대신 도시 상세 뷰
const cityParam = new URLSearchParams(location.search).get('city');

function postFor(c) {
  return cityPosts.find(p => (p.title || '').trim().toLowerCase() === c.en.toLowerCase());
}

function draw() {
  const list = document.getElementById('fieldList');
  const city = CITIES.find(c => c.key === cityParam);
  list.innerHTML = '';
  if (city) {
    // 도시 상세 페이지
    const back = document.createElement('a');
    back.className = 'field-back';
    back.href = 'fieldwork';
    back.textContent = t('back');
    list.appendChild(back);
    const title = document.createElement('div');
    title.className = 'field-row';
    title.style.cursor = 'default';
    title.textContent = (LANG === 'ko' ? city.ko : city.en);
    list.appendChild(title);
    const body = document.createElement('div');
    body.className = 'field-body';
    const p = postFor(city);
    if (p) {
      body.innerHTML =
        (p.cover ? '<img src="' + escapeHtml(p.cover) + '">' : '') +
        '<div class="article-body">' + renderMarkdown(pickLangBody(p)) + '</div>';
    } else {
      body.innerHTML = '<p class="sub">' + t('projComingSoon') + '</p>';
    }
    body.style.borderBottom = 'none';
    list.appendChild(body);
    return;
  }
  // 도시 목록 — 클릭하면 상세 페이지로 이동
  CITIES.forEach(c => {
    const row = document.createElement('a');
    row.className = 'field-row';
    row.href = 'fieldwork?city=' + c.key;
    row.style.display = 'block';
    row.style.textDecoration = 'none';
    row.textContent = (LANG === 'ko' ? c.ko : c.en);
    list.appendChild(row);
  });
  const tz = document.createElement('div');
  tz.className = 'field-teaser';
  tz.textContent = (LANG === 'ko' ? TEASER.ko : TEASER.en);
  list.appendChild(tz);
}

(async () => {
  try { cityPosts = await loadPosts('fieldwork'); } catch (e) { cityPosts = []; }
  draw();
})();
window._lcRerender = draw;
</script>
</body>
</html>
