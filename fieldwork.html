<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fieldwork — Liquid Cities Project</title>
<link rel="stylesheet" href="style.css?v=20260730b">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<header id="site-header"></header>

<main id="fieldworkMain">
  <div id="fieldList"></div>
</main>

<div class="footer">©2026 Liquid Cities Project</div>

<script src="app.js?v=20260730b"></script>
<script>
renderHeader('fieldwork');
applyI18n();

// 도시별 이벤트(랩·전시) 목록 — 도시 상세에서 가로줄 리스트로 표시
const CITY_EVENTS = {
  seoul: [
    { key: 'seoul-202607', title: '07.28 - 07.29 /2026' },
  ],
};

// 필드워크 도시 목록 — 가로 선으로 구분된 행. 도시가 늘면 여기에 추가.
// 내용은 posts(kind='fieldwork', 제목=영문 도시명)로 관리 — 행을 누르면 펼쳐진다.
const CITIES = [
  { key: 'seoul',     en: 'Seoul',     ko: '서울', active: true },
  { key: 'london',    en: 'London',    ko: '런던' },
  { key: 'singapore', en: 'Singapore', ko: '싱가포르' },
  { key: 'shanghai',  en: 'Shanghai',  ko: '상하이' },
];

let cityPosts = [];
// ?city=seoul → 도시 상세, ?event=키 → 이벤트 상세
const _fwq = new URLSearchParams(location.search);
const cityParam = _fwq.get('city');
const eventParam = _fwq.get('event');

function postByTitle(title) {
  return cityPosts.find(p => (p.title || '').trim().toLowerCase() === title.toLowerCase());
}
function postFor(c) { return postByTitle(c.en); }
function findEvent(key) {
  for (const ck of Object.keys(CITY_EVENTS)) {
    const ev = CITY_EVENTS[ck].find(e => e.key === key);
    if (ev) return { cityKey: ck, ev };
  }
  return null;
}

function draw() {
  const list = document.getElementById('fieldList');
  const city = CITIES.find(c => c.key === cityParam);
  list.innerHTML = '';
  // 이벤트 상세 — manage에서 kind=Fieldwork, 제목을 이벤트 제목과 동일하게 쓰면 표시됨
  const hit = eventParam ? findEvent(eventParam) : null;
  if (hit) {
    const back = document.createElement('a');
    back.className = 'field-back';
    back.href = 'fieldwork?city=' + hit.cityKey;
    back.textContent = t('back');
    list.appendChild(back);
    const title = document.createElement('div');
    title.className = 'field-row';
    title.style.cursor = 'default';
    title.textContent = hit.ev.title;
    list.appendChild(title);
    const body = document.createElement('div');
    body.className = 'field-body';
    const p = postByTitle(hit.ev.title);
    if (p) {
      body.innerHTML =
        (p.cover ? '<img src="' + escapeHtml(p.cover) + '">' : '') +
        '<div class="article-body">' + renderMarkdown(pickLangBody(p)) + '</div>';
    } else {
      body.innerHTML = '<p class="sub">' + t('projComingSoon') + '</p>';
    }
    body.style.borderBottom = 'none';
    list.appendChild(body);
    return;
  }
  if (city) {
    // 도시 상세 페이지
    const back = document.createElement('a');
    back.className = 'field-back';
    back.href = 'fieldwork';
    back.textContent = t('back');
    list.appendChild(back);
    const title = document.createElement('div');
    title.className = 'field-row';
    title.style.cursor = 'default';
    title.textContent = (LANG === 'ko' ? city.ko : city.en);
    list.appendChild(title);
    // 이벤트(랩·전시) 리스트 — 헤더와 같은 간격의 가로줄 행
    const events = CITY_EVENTS[city.key] || [];
    events.forEach(ev => {
      const row = document.createElement('a');
      row.className = 'fw-event-row';
      row.href = 'fieldwork?event=' + ev.key;
      row.style.display = 'block';
      row.style.textDecoration = 'none';
      row.textContent = ev.title;
      list.appendChild(row);
    });
    const body = document.createElement('div');
    body.className = 'field-body';
    const p = postFor(city);
    if (p) {
      body.innerHTML =
        (p.cover ? '<img src="' + escapeHtml(p.cover) + '">' : '') +
        '<div class="article-body">' + renderMarkdown(pickLangBody(p)) + '</div>';
    } else if (!events.length) {
      body.innerHTML = '<p class="sub">' + t('projComingSoon') + '</p>';
    }
    body.style.borderBottom = 'none';
    list.appendChild(body);
    return;
  }
  // 도시 목록 — 활성 도시만 클릭(상세 이동), 나머지는 회색 표시
  CITIES.forEach(c => {
    let row;
    if (c.active) {
      row = document.createElement('a');
      row.href = 'fieldwork?city=' + c.key;
      row.style.display = 'block';
      row.style.textDecoration = 'none';
      row.className = 'field-row';
    } else {
      row = document.createElement('div');
      row.className = 'field-row dim';
    }
    row.textContent = (LANG === 'ko' ? c.ko : c.en);
    list.appendChild(row);
  });
  // 마지막 행 — What's next? (같은 크기, 회색, 클릭 없음)
  const tz = document.createElement('div');
  tz.className = 'field-row dim';
  tz.textContent = "Where next?";
  list.appendChild(tz);
}

(async () => {
  try { cityPosts = await loadPosts('fieldwork'); } catch (e) { cityPosts = []; }
  draw();
})();
window._lcRerender = draw;
</script>
</body>
</html>
